# ============================================================
#  Perfil de producción:  java -jar platform.jar --spring.profiles.active=prod
#  En producción NO se expone la documentación de la API.
#  Define obligatoriamente DB_URL, DB_USER, DB_PASSWORD y JWT_SECRET como variables de entorno.
# ============================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.jpa.properties.hibernate.format_sql=false
logging.level.root=WARN
logging.level.com.rentaherramientas=INFO
