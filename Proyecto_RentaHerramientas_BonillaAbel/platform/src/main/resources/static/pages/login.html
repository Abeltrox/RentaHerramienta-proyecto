<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · RentaHerramientas</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/index.html" style="color:var(--brand)"><span class="mark">⚙</span> RentaHerramientas</a>
      <h1 style="margin-top:1rem">Inicia sesión</h1>
      <p class="muted">Accede con tu cuenta de administrador, proveedor o cliente.</p>
      <div id="aviso"></div>
      <form id="form" novalidate>
        <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn accent block" type="submit">Entrar</button>
      </form>
      <p style="text-align:center;margin-top:1rem">¿Eres cliente nuevo? <a href="/pages/register.html">Crea tu cuenta</a></p>
      <div class="demo-users">
        <strong>Cuentas de prueba</strong> (datos del script SQL):<br>
        <button type="button" data-demo="admin@rentaherramientas.com|Admin123*">Administrador</button>
        <button type="button" data-demo="proveedor01@rentaherramientas.com|Proveedor123*">Proveedor</button>
        <button type="button" data-demo="cliente01@rentaherramientas.com|Cliente123*">Cliente</button>
      </div>
    </div>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
