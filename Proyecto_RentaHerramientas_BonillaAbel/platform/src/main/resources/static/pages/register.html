<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · RentaHerramientas</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card wide">
      <a class="brand" href="/index.html" style="color:var(--brand)"><span class="mark">⚙</span> RentaHerramientas</a>
      <h1 style="margin-top:1rem">Crea tu cuenta de cliente</h1>
      <p class="muted">Los proveedores son registrados por el administrador de la plataforma.</p>
      <div id="aviso"></div>
      <form id="form" novalidate>
        <div class="form-grid">
          <div class="field"><label for="nombre">Nombre completo *</label><input id="nombre" name="nombre" required maxlength="120" autocomplete="name"></div>
          <div class="field"><label for="documento">Documento *</label><input id="documento" name="documento" required maxlength="30"></div>
          <div class="field"><label for="email">Correo *</label><input id="email" name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" maxlength="30" autocomplete="tel"></div>
          <div class="field"><label for="ciudad">Ciudad</label><input id="ciudad" name="ciudad" maxlength="80"></div>
          <div class="field"><label for="direccion">Dirección</label><input id="direccion" name="direccion" maxlength="200" autocomplete="street-address"></div>
          <div class="field"><label for="password">Contraseña *</label><input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><span class="hint">Mínimo 8 caracteres</span></div>
          <div class="field"><label for="confirmar">Confirmar contraseña *</label><input id="confirmar" name="confirmar" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div>
        </div>
        <button class="btn accent block" type="submit">Crear cuenta</button>
      </form>
      <p style="text-align:center;margin-top:1rem">¿Ya tienes cuenta? <a href="/pages/login.html">Inicia sesión</a></p>
    </div>
  </main>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
