# ============================================================
#  Plataforma de Renta de Herramientas - Configuración
#  Las variables de entorno (DB_URL, DB_USER, ...) tienen prioridad.
# ============================================================
spring.application.name=renta-herramientas
server.port=8080

# ---------- Base de datos PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/renta_herramientas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# El esquema lo crea Flyway; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------- Flyway (scripts en src/main/resources/db/migration) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
# Secreto en Base64 (mínimo 32 bytes). CÁMBIALO en producción con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:X5fEHlaie38uyhNN0PUveQTZH/PyMrQjAK7wpvEvy0xZBn+UcYEcPeBp4ryvM/SqT7rDpeGozkwJRKuHMEqDEQ==}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------- CORS (orígenes permitidos para el frontend) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# ---------- Imágenes de herramientas ----------
app.storage.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Vencimiento automático de reservas (milisegundos entre revisiones) ----------
app.reservas.revision-vencimiento-ms=600000

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.rentaherramientas=DEBUG
